<style>
:root{
  --coral:#E07A82; --coral-deep:#C75F68;
  --teal:#34BCB4;  --teal-deep:#1F9E97;
  --ink:#2C3340;   --slate:#5B6472;  --muted:#9AA3B2;
  --bg:#F3F5F8;     --card:#FFFFFF;   --line:#E5E9EF;  --line-soft:#EEF1F5;
  --shadow:0 1px 2px rgba(44,51,64,.04), 0 8px 24px rgba(44,51,64,.06);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.65; -webkit-font-smoothing:antialiased; min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 500px at 88% -8%, rgba(52,188,180,.10), transparent 60%),
    radial-gradient(800px 500px at -5% 110%, rgba(224,122,130,.10), transparent 60%);
}
h1,h2,h3,.serif{font-family:"Noto Serif TC",serif;}
a{color:inherit;}

/* ---------- Header ---------- */
header{position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);}
header .accent{height:4px;background:linear-gradient(90deg,var(--coral),var(--teal));}
.head-inner{max-width:1280px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{width:46px;height:46px;border-radius:12px;object-fit:contain;
  background:#fff;padding:5px;box-shadow:var(--shadow);}
.brand .txt h1{font-size:1.3rem;font-weight:900;letter-spacing:.5px;line-height:1.1;}
.brand .txt .sub{font-size:.72rem;color:var(--muted);letter-spacing:.5px;margin-top:2px;}
.head-actions{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.date-chip{font-size:.76rem;color:var(--slate);background:var(--line-soft);
  padding:8px 13px;border-radius:999px;font-variant-numeric:tabular-nums;}
.btn{font-family:inherit;font-size:.83rem;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:10px 15px;border-radius:11px;transition:.18s ease;display:inline-flex;
  align-items:center;gap:7px;white-space:nowrap;min-height:42px;-webkit-tap-highlight-color:transparent;}
.btn:hover{border-color:var(--teal);color:var(--teal-deep);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  color:#fff;border:none;box-shadow:0 6px 16px rgba(31,158,151,.30);}
.btn.primary:hover{color:#fff;filter:brightness(1.05);}
.btn.warm{background:linear-gradient(135deg,var(--coral),var(--coral-deep));
  color:#fff;border:none;box-shadow:0 6px 16px rgba(199,95,104,.28);}
.btn.warm:hover{color:#fff;filter:brightness(1.05);}
.btn svg{width:15px;height:15px;flex:none;}

/* ---------- Layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:24px 22px 70px;
  display:grid;grid-template-columns:260px 1fr;gap:24px;}

/* ---------- Sidebar / Nav ---------- */
aside{position:sticky;top:92px;align-self:start;}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px;}
.side-label{font-size:.68rem;font-weight:700;letter-spacing:2px;color:var(--muted);
  padding:6px 10px 9px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:11px;
  cursor:pointer;transition:.15s;border:1px solid transparent;
  -webkit-tap-highlight-color:transparent;}
.nav-item:hover{background:var(--line-soft);}
.nav-item.active{background:linear-gradient(135deg,rgba(224,122,130,.12),rgba(52,188,180,.12));
  border-color:rgba(52,188,180,.35);}
.nav-item .dot{width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--teal);box-shadow:0 0 0 3px rgba(52,188,180,.18);}
.nav-item.warm-dot .dot{background:var(--coral);box-shadow:0 0 0 3px rgba(224,122,130,.18);}
.nav-item .name{font-weight:700;font-size:.92rem;flex:1;}
.nav-item .name small{display:block;font-weight:400;font-size:.7rem;color:var(--muted);margin-top:1px;}
.nav-item .del{display:none;border:none;background:none;color:var(--coral-deep);
  cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;}
.nav-item .del:hover{background:rgba(224,122,130,.15);}
body.editing .nav-item .del{display:block;}
.nav-divider{height:1px;background:var(--line);margin:10px 4px;}
.add-row{display:none;width:100%;justify-content:center;margin-top:6px;
  border-style:dashed;color:var(--slate);}
body.editing .add-row{display:flex;}

/* ---------- Main ---------- */
main{min-width:0;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px 30px;margin-bottom:20px;}
.station-head{border-bottom:1px solid var(--line-soft);padding-bottom:20px;margin-bottom:22px;}
.station-head h2{font-size:1.6rem;font-weight:900;display:flex;align-items:center;
  gap:11px;flex-wrap:wrap;line-height:1.25;}
.tag{font-family:"Noto Sans TC";font-size:.72rem;font-weight:700;letter-spacing:.5px;
  padding:5px 12px;border-radius:999px;background:rgba(52,188,180,.14);color:var(--teal-deep);}
.info-rows{margin-top:15px;display:flex;flex-direction:column;gap:11px;}
.info-line{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;color:var(--slate);flex-wrap:wrap;}
.info-line .addr{flex:1;min-width:160px;}
.map-btn{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;
  text-decoration:none;padding:8px 13px;border-radius:10px;min-height:38px;
  background:rgba(52,188,180,.12);color:var(--teal-deep);border:1px solid rgba(52,188,180,.3);
  transition:.15s;-webkit-tap-highlight-color:transparent;}
.map-btn:hover{background:rgba(52,188,180,.2);}
.map-btn.warm{background:rgba(224,122,130,.12);color:var(--coral-deep);border-color:rgba(224,122,130,.3);}
.tel-link{font-weight:700;color:var(--coral-deep);text-decoration:none;border-bottom:1px dashed;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;}
.chip{font-size:.74rem;font-weight:700;background:var(--line-soft);color:var(--slate);
  padding:5px 11px;border-radius:8px;}

.section-title{font-size:1.04rem;font-weight:900;font-family:"Noto Serif TC";
  display:flex;align-items:center;gap:10px;margin:26px 0 14px;}
.section-title:first-child{margin-top:0;}
.section-title::before{content:"";width:5px;height:18px;border-radius:3px;flex:none;
  background:linear-gradient(var(--coral),var(--teal));}

/* ---------- Schedule table ---------- */
.scroll-hint{font-size:.72rem;color:var(--muted);margin:-6px 0 8px;display:none;}
.table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);
  -webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:680px;font-size:.9rem;}
thead th{background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;
  letter-spacing:.5px;padding:13px 10px;text-align:center;white-space:nowrap;}
thead th:first-child{text-align:left;padding-left:16px;position:sticky;left:0;z-index:3;
  background:var(--ink);box-shadow:2px 0 0 rgba(255,255,255,.08);}
thead th.weekend{background:#3a4150;}
tbody td{padding:11px 10px;text-align:center;border-top:1px solid var(--line-soft);
  color:var(--slate);font-variant-numeric:tabular-nums;}
tbody tr:nth-child(even) td{background:#FAFBFC;}
tbody td.shift{text-align:left;padding-left:16px;position:sticky;left:0;z-index:2;
  background:#fff;box-shadow:2px 0 0 var(--line);min-width:150px;}
tbody tr:nth-child(even) td.shift{background:#FAFBFC;}
.shift .sname{font-weight:700;color:var(--ink);display:block;}
.shift .stime{font-size:.74rem;color:var(--muted);white-space:nowrap;}
tbody td.weekend{background:rgba(224,122,130,.05);}
tbody tr:nth-child(even) td.weekend{background:rgba(224,122,130,.08);}
.person{font-weight:500;color:var(--ink);}

/* 月曆式月班表 */
.month-table th.corner{min-width:96px;}
.month-table thead th.sun{background:#5a3138;}
.month-table td{min-width:78px;}
.month-table td.shift{font-weight:700;color:var(--ink);min-width:96px;}
.month-table .wk-date td{background:#F4F6F8;font-variant-numeric:tabular-nums;font-weight:700;color:var(--slate);}
.month-table tbody tr:nth-child(even) td{background:transparent;}
.month-table .wk-date td.shift{background:#EEF1F5;color:var(--ink);}
.month-table td.sun{background:rgba(224,122,130,.06);}
.month-table .wk-date td.sun{background:rgba(224,122,130,.12);color:var(--coral-deep);}
.month-table td.sun .person{color:var(--coral-deep);}
.month-table td.weekend{background:rgba(44,51,64,.025);}
.month-table .wk-sep td{border-top:2px solid var(--line);}

/* ---------- Collapsible note sections ---------- */
.nsec{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;
  background:#fff;}
.nsec-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  font-weight:700;color:var(--ink);background:#FBFCFD;transition:.15s;
  -webkit-tap-highlight-color:transparent;font-size:.95rem;}
.nsec-head:hover{background:var(--line-soft);}
.nsec-head .chev{margin-left:auto;flex:none;transition:transform .2s;color:var(--muted);}
.nsec.open .nsec-head{background:linear-gradient(135deg,rgba(224,122,130,.08),rgba(52,188,180,.08));}
.nsec.open .chev{transform:rotate(90deg);}
.nsec-body{display:none;padding:14px 18px 18px;}
.nsec.open .nsec-body{display:block;}
.note-body{white-space:pre-wrap;word-break:break-word;font-size:.9rem;color:var(--slate);
  line-height:1.85;}
.note-bar{display:flex;gap:8px;margin-bottom:12px;}
.note-bar .mini-btn{font-size:.74rem;}

/* ---------- Regulations ---------- */
.reg-section{margin-bottom:24px;}
.reg-section:last-child{margin-bottom:0;}
.reg-body{white-space:pre-wrap;word-break:break-word;font-size:.92rem;color:var(--slate);
  line-height:1.9;background:#FBFCFD;border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;}
.reg-list{list-style:none;margin-top:6px;}
.reg-list li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:.92rem;color:var(--slate);align-items:flex-start;}
.reg-list li:last-child{border-bottom:none;}
.reg-list .num{flex:none;width:24px;height:24px;border-radius:7px;font-size:.74rem;
  font-weight:700;display:flex;align-items:center;justify-content:center;
  background:rgba(52,188,180,.14);color:var(--teal-deep);margin-top:1px;}

/* ---------- Edit mode ---------- */
.edit-only{display:none;}
body.editing .edit-only{display:flex;}
input.f, textarea.f{font-family:inherit;font-size:.92rem;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;
  width:100%;transition:.15s;}
input.f:focus, textarea.f:focus{outline:none;border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(52,188,180,.15);}
textarea.f{resize:vertical;min-height:120px;line-height:1.7;white-space:pre-wrap;}
.cell-in{text-align:center;font-size:.86rem;padding:7px 6px;}
.mini-btn{border:1px solid var(--line);background:#fff;color:var(--slate);cursor:pointer;
  border-radius:9px;padding:8px 13px;font-size:.8rem;font-weight:700;font-family:inherit;
  transition:.15s;min-height:40px;-webkit-tap-highlight-color:transparent;}
.mini-btn:hover{border-color:var(--teal);color:var(--teal-deep);}
.mini-btn.danger:hover{border-color:var(--coral);color:var(--coral-deep);}
.row-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.edit-banner{display:none;background:linear-gradient(135deg,rgba(224,122,130,.12),rgba(52,188,180,.12));
  border:1px solid rgba(52,188,180,.3);border-radius:12px;padding:13px 18px;margin-bottom:18px;
  font-size:.85rem;color:var(--slate);align-items:center;gap:10px;}
body.editing .edit-banner{display:flex;}
.edit-banner b{color:var(--teal-deep);}
.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:13px;}
.field-grid label,.fld label{font-size:.7rem;font-weight:700;color:var(--muted);
  letter-spacing:.5px;display:block;margin-bottom:5px;}
.fld{margin-bottom:13px;}
.map-edit{display:flex;gap:8px;margin-bottom:9px;align-items:center;flex-wrap:wrap;}
.map-edit input{flex:1;min-width:120px;}
.nsec-edit{border:1px dashed var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}

/* ---------- Google 簽到橫幅 ---------- */
.signin-banner{display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));
  color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:20px;
  box-shadow:0 10px 28px rgba(31,158,151,.30);position:relative;overflow:hidden;}
.signin-banner::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);}
.sb-icon{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.2);z-index:1;}
.sb-icon svg{width:25px;height:25px;color:#fff;}
.sb-text{flex:1;min-width:0;z-index:1;}
.sb-title{font-family:"Noto Serif TC";font-weight:900;font-size:1.12rem;letter-spacing:.5px;}
.sb-note{font-size:.86rem;opacity:.95;margin-top:3px;line-height:1.6;}
.sb-btn{flex:none;z-index:1;background:#fff;color:var(--teal-deep);font-weight:900;font-size:.9rem;
  text-decoration:none;padding:12px 20px;border-radius:11px;white-space:nowrap;transition:.15s;
  box-shadow:0 4px 12px rgba(0,0,0,.14);-webkit-tap-highlight-color:transparent;}
.sb-btn:hover{transform:translateY(-1px);}
.sb-edit{flex:1;z-index:1;}
.sb-edit input{width:100%;margin-bottom:8px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.94);border-radius:9px;padding:9px 11px;font-family:inherit;
  font-size:.9rem;color:var(--ink);}
.sb-edit input:last-child{margin-bottom:0;}
@media(max-width:880px){
  .signin-banner{flex-direction:column;align-items:stretch;padding:16px 18px;}
  .sb-btn{text-align:center;}
}
/* 行內圖示 */
.info-line .ic{flex:none;width:22px;display:flex;justify-content:center;color:var(--teal-deep);}
.info-line .ic svg{width:18px;height:18px;}
.map-btn svg{width:14px;height:14px;}
.nsec-head .nicon{flex:none;display:flex;}
.nsec-head .nicon svg{width:18px;height:18px;}

.foot{text-align:center;color:var(--muted);font-size:.76rem;padding:14px;}

/* ---------- Mobile ---------- */
@media(max-width:880px){
  header{position:static;}
  .head-inner{padding:11px 16px;gap:11px;}
  .brand .txt h1{font-size:1.18rem;}
  .date-chip{order:5;width:100%;text-align:center;}
  .head-actions{width:100%;}
  .head-actions .btn{flex:1;justify-content:center;}

  .wrap{grid-template-columns:1fr;gap:14px;padding:14px 13px 60px;}
  aside{position:sticky;top:0;z-index:40;margin:0 -13px;}
  .side-card{display:flex;gap:8px;overflow-x:auto;padding:11px 13px;border-radius:0;
    border-left:none;border-right:none;-webkit-overflow-scrolling:touch;
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);}
  .side-card::-webkit-scrollbar{display:none;}
  #nav-stations,#nav-rules{display:contents;}
  .side-label,.nav-divider{display:none;}
  .nav-item{flex:0 0 auto;white-space:nowrap;padding:10px 15px;border:1px solid var(--line);
    background:#fff;}
  .nav-item.active{border-color:rgba(52,188,180,.5);}
  .nav-item .name small{display:none;}
  .add-row{flex:0 0 auto;width:auto;margin-top:0;}

  .panel{padding:20px 16px;border-radius:14px;}
  .station-head h2{font-size:1.32rem;}
  .field-grid{grid-template-columns:1fr;}
  .scroll-hint{display:block;}
}

/* ---------- Print ---------- */
@media print{
  header,aside,.head-actions,.edit-banner,.edit-only,.row-tools,.add-row,.foot,
  .scroll-hint,.note-bar{display:none!important;}
  body{background:#fff;} body::before{display:none;}
  .wrap{display:block;padding:0;}
  .panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  .nsec-body{display:block!important;}
  .table-scroll{overflow:visible;}
}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{animation:rise .45s ease both;}
</style>

<header>

      </button>

<div class="wrap">

      <div id="nav-rules"></div>
    </div>

    <div class="edit-banner">
      <span><b>編輯模式</b>已開啟,直接點欄位修改即可。完成後請按右上「<b>下載最新檔案</b>」存成新網頁檔。</span>
    </div>
    <div id="content"></div>
    <div class="foot">怡安救護站 · 內部管理系統　|　資料僅存於本檔案,修改後請務必下載保存</div>
  </main>
</div>

<script>
const WEEK = ["週一","週二","週三","週四","週五","週六","週日"];
let STATE, editMode = false, current = { type:"station", id:null };

function loadState(){
  try{ STATE = JSON.parse(document.getElementById("seed-data").textContent); }
  catch(e){ STATE = { company:{name:"怡安救護站",subtitle:""}, stations:[], regulations:[] }; }
  STATE.stations.forEach(s=>{ s.maps=s.maps||[]; s.noteSections=s.noteSections||[]; s.rows=s.rows||[]; });
  STATE.signin = STATE.signin || {title:"GOOGLE 線上簽到表", note:"每日上班請務必記得 LINE 打卡,並完成線上簽到。", url:""};
  if(!current.id && STATE.stations.length) current = { type:"station", id:STATE.stations[0].id };
}

function setToday(){
  const d=new Date(), wd=["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("today").textContent =
    `${d.getFullYear()} / ${String(d.getMonth()+1).padStart(2,"0")} / ${String(d.getDate()).padStart(2,"0")}　週${wd}`;
}

/* ---------- Sidebar ---------- */
function renderSidebar(){
  const nav=document.getElementById("nav-stations"); nav.innerHTML="";
  STATE.stations.forEach(s=>{
    const el=document.createElement("div");
    el.className="nav-item"+(current.type==="station"&&current.id===s.id?" active":"");
    el.innerHTML=`<span class="dot"></span>
      <span class="name">${esc(s.name)}<small>${esc(s.tag||"")}</small></span>
      <button class="del" title="刪除">×</button>`;
    const go=()=>{ current={type:"station",id:s.id}; render(); scrollTopMobile(); };
    el.querySelector(".name").onclick=go; el.querySelector(".dot").onclick=go;
    el.querySelector(".del").onclick=(ev)=>{ ev.stopPropagation(); removeStation(s.id); };
    nav.appendChild(el);
  });
  const rules=document.getElementById("nav-rules"); rules.innerHTML="";
  STATE.regulations.forEach((sec,i)=>{
    const r=document.createElement("div");
    r.className="nav-item warm-dot"+(current.type==="rules"&&current.id===i?" active":"");
    r.innerHTML=`<span class="dot"></span><span class="name">${esc(sec.title)}</span>`;
    r.onclick=()=>{ current={type:"rules",id:i}; render(); scrollTopMobile(); };
    rules.appendChild(r);
  });
}
function scrollTopMobile(){ if(window.innerWidth<=880) window.scrollTo({top:0,behavior:"instant"}); }

/* ---------- Icons (inline SVG, 無 emoji) ---------- */
const IC = {
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  building:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><path d="m9 11 3 3L22 4"/></svg>'
};
function noteIcon(t){ if(/注意|須知|警示|警告|停車/.test(t)) return IC.warn; if(/常規|流程|規定|規範|步驟|辦理/.test(t)) return IC.clip; return IC.info; }
function noteColor(t){ if(/注意|須知|警示|警告|停車/.test(t)) return "var(--coral-deep)"; if(/常規|流程|規定|規範|步驟|辦理/.test(t)) return "var(--teal-deep)"; return "var(--slate)"; }

/* ---------- Google 線上簽到橫幅(常駐顯眼處) ---------- */
function renderSignin(){
  const sg=STATE.signin||{};
  const wrap=document.createElement("div"); wrap.className="signin-banner";
  if(!editMode){
    wrap.innerHTML=`<div class="sb-icon">${IC.check}</div>
      <div class="sb-text">
        <div class="sb-title">${esc(sg.title||"GOOGLE 線上簽到表")}</div>
        <div class="sb-note">${esc(sg.note||"")}</div>
      </div>
      ${sg.url?`<a class="sb-btn" href="${esc(sg.url)}" target="_blank" rel="noopener">開啟簽到表 →</a>`:""}`;
  } else {
    wrap.innerHTML=`<div class="sb-icon">${IC.check}</div>`;
    const box=document.createElement("div"); box.className="sb-edit";
    const t=document.createElement("input"); t.value=sg.title||""; t.placeholder="專區名稱";
    const n=document.createElement("input"); n.value=sg.note||""; n.placeholder="提醒文字";
    const u=document.createElement("input"); u.value=sg.url||""; u.placeholder="Google 簽到表網址";
    t.oninput=e=>sg.title=e.target.value; n.oninput=e=>sg.note=e.target.value; u.oninput=e=>sg.url=e.target.value;
    box.append(t,n,u); wrap.appendChild(box);
  }
  return wrap;
}

/* ---------- Main render ---------- */
function render(){
  renderSidebar();
  const c=document.getElementById("content"); c.innerHTML="";
  c.appendChild(renderSignin());
  if(current.type==="rules"){ c.appendChild(renderRules()); }
  else{
    const s=STATE.stations.find(x=>x.id===current.id)||STATE.stations[0];
    if(s){ current={type:"station",id:s.id}; c.appendChild(renderStation(s)); }
    else c.innerHTML=`<div class="panel">目前沒有救護站,請於上方「＋ 新增救護站」。</div>`;
  }
}

/* ---------- Station ---------- */
function telHref(p){ return "tel:"+String(p||"").replace(/[^\d+]/g,""); }

/* ---------- 月曆式月班表 ---------- */
function renderMonth(p, s){
  const m=s.month; const shifts=m.shifts||[];
  if(editMode){
    const head=document.createElement("div"); head.className="row-tools"; head.style.marginBottom="10px";
    const lb=document.createElement("input"); lb.className="f"; lb.style.maxWidth="220px"; lb.value=m.label||""; lb.placeholder="月份標題(如 2026 年 6 月)";
    lb.oninput=e=>m.label=e.target.value; head.appendChild(lb); p.appendChild(head);
  }
  const scroll=document.createElement("div"); scroll.className="table-scroll";
  const table=document.createElement("table"); table.className="month-table";
  let hrow=`<th class="corner"></th>`;
  WEEK.forEach((w,i)=>hrow+=`<th class="${i===6?'sun':(i===5?'weekend':'')}">${w}</th>`);
  table.innerHTML=`<thead><tr>${hrow}</tr></thead>`;
  const tbody=document.createElement("tbody");

  (m.weeks||[]).forEach((wk,wi)=>{
    /* 日期列 */
    const dtr=document.createElement("tr"); dtr.className="wk-date"+(wi>0?" wk-sep":"");
    const dlab=document.createElement("td"); dlab.className="shift"; dlab.textContent="日 期"; dtr.appendChild(dlab);
    for(let i=0;i<7;i++){
      const td=document.createElement("td"); td.className=(i===6?"sun":(i===5?"weekend":""));
      const v=(wk.dates&&wk.dates[i])||"";
      if(!editMode){ td.textContent=v||""; }
      else{ const inp=document.createElement("input"); inp.className="f cell-in"; inp.value=v;
        inp.oninput=e=>{ if(!wk.dates)wk.dates=Array(7).fill(""); wk.dates[i]=e.target.value; }; td.appendChild(inp); }
      dtr.appendChild(td);
    }
    tbody.appendChild(dtr);
    /* 各班別人員列 */
    shifts.forEach((shLabel,si)=>{
      const tr=document.createElement("tr");
      const lab=document.createElement("td"); lab.className="shift";
      if(!editMode){ lab.textContent=shLabel; }
      else{ const inp=document.createElement("input"); inp.className="f"; inp.value=shLabel; inp.style.minWidth="92px";
        inp.oninput=e=>{ m.shifts[si]=e.target.value; }; lab.appendChild(inp); }
      tr.appendChild(lab);
      for(let i=0;i<7;i++){
        const td=document.createElement("td"); td.className=(i===6?"sun":(i===5?"weekend":""));
        const name=(wk.cells&&wk.cells[si]&&wk.cells[si][i])||"";
        if(!editMode){ td.innerHTML=`<span class="person">${esc(name||"")}</span>`; }
        else{ const inp=document.createElement("input"); inp.className="f cell-in"; inp.value=name;
          inp.oninput=e=>{ if(!wk.cells)wk.cells=[]; if(!wk.cells[si])wk.cells[si]=Array(7).fill(""); wk.cells[si][i]=e.target.value; };
          td.appendChild(inp); }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody); scroll.appendChild(table); p.appendChild(scroll);

  if(editMode){
    const tools=document.createElement("div"); tools.className="row-tools";
    const a=document.createElement("button"); a.className="mini-btn"; a.textContent="＋ 新增一週";
    a.onclick=()=>{ m.weeks.push({dates:Array(7).fill(""),cells:shifts.map(()=>Array(7).fill(""))}); render(); };
    const d=document.createElement("button"); d.className="mini-btn danger"; d.textContent="－ 刪除最後一週";
    d.onclick=()=>{ if(m.weeks.length){ m.weeks.pop(); render(); } };
    tools.append(a,d); p.appendChild(tools);
  }
}

function renderStation(s){
  const p=document.createElement("div"); p.className="panel";
  const head=document.createElement("div"); head.className="station-head";

  if(!editMode){
    let maps=(s.maps||[]).map((m,i)=>
      `<a class="map-btn${i>0?' warm':''}" href="${esc(m.url)}" target="_blank" rel="noopener">${IC.pin} ${esc(m.label||"開啟地圖")}</a>`).join("");
    let chips="";
    if(s.dept) chips+=`<span class="chip">部門：${esc(s.dept)}</span>`;
    if(s.caseNo) chips+=`<span class="chip">案號：${esc(s.caseNo)}</span>`;
    head.innerHTML=`
      <h2>${esc(s.name)} ${s.tag?`<span class="tag">${esc(s.tag)}</span>`:""}</h2>
      <div class="info-rows">
        ${s.address?`<div class="info-line"><span class="ic">${IC.pin}</span><span class="addr">${esc(s.address)}</span>${maps}</div>`:(maps?`<div class="info-line"><span class="ic">${IC.pin}</span>${maps}</div>`:"")}
        ${s.phone?`<div class="info-line"><span class="ic">${IC.phone}</span><span>公務機 <a class="tel-link" href="${telHref(s.phone)}">${esc(s.phone)}</a></span></div>`:""}
        ${chips?`<div class="info-line"><span class="ic">${IC.building}</span><div class="chips">${chips}</div></div>`:""}
      </div>`;
  } else {
    head.innerHTML=`
      <div class="field-grid">
        <div class="fld"><label>救護站名稱</label><input class="f" id="f-name" value="${esc(s.name)}"></div>
        <div class="fld"><label>類別標籤(如:日班・夜班)</label><input class="f" id="f-tag" value="${esc(s.tag||"")}"></div>
      </div>
      <div class="fld"><label>地址</label><input class="f" id="f-addr" value="${esc(s.address||"")}"></div>
      <div class="field-grid">
        <div class="fld"><label>公務機 / 電話</label><input class="f" id="f-phone" value="${esc(s.phone||"")}"></div>
        <div class="fld"><label>站長 / 負責人</label><input class="f" id="f-sup" value="${esc(s.supervisor||"")}"></div>
      </div>
      <div class="field-grid">
        <div class="fld"><label>部門(工地)</label><input class="f" id="f-dept" value="${esc(s.dept||"")}"></div>
        <div class="fld"><label>工地案號</label><input class="f" id="f-case" value="${esc(s.caseNo||"")}"></div>
      </div>
      <div class="fld"><label>地圖連結(可多筆)</label><div id="maps-edit"></div>
        <button class="mini-btn" id="add-map">＋ 新增地圖連結</button></div>`;
    const q=id=>head.querySelector(id);
    q("#f-name").oninput=e=>s.name=e.target.value;
    q("#f-tag").oninput=e=>s.tag=e.target.value;
    q("#f-addr").oninput=e=>s.address=e.target.value;
    q("#f-phone").oninput=e=>s.phone=e.target.value;
    q("#f-sup").oninput=e=>s.supervisor=e.target.value;
    q("#f-dept").oninput=e=>s.dept=e.target.value;
    q("#f-case").oninput=e=>s.caseNo=e.target.value;
    const me=q("#maps-edit");
    (s.maps||[]).forEach((m,i)=>{
      const row=document.createElement("div"); row.className="map-edit";
      row.innerHTML=`<input class="f" placeholder="名稱(如:救護站位置)" value="${esc(m.label||"")}">
        <input class="f" placeholder="https://maps..." value="${esc(m.url||"")}">
        <button class="mini-btn danger">×</button>`;
      const ins=row.querySelectorAll("input");
      ins[0].oninput=e=>m.label=e.target.value; ins[1].oninput=e=>m.url=e.target.value;
      row.querySelector("button").onclick=()=>{ s.maps.splice(i,1); render(); };
      me.appendChild(row);
    });
    q("#add-map").onclick=()=>{ s.maps.push({label:"",url:""}); render(); };
  }
  p.appendChild(head);

  /* schedule */
  const st=document.createElement("div"); st.className="section-title";
  st.textContent = s.month ? ("值班班表 — "+(s.month.label||"")) : "值班班表";
  p.appendChild(st);
  const hint=document.createElement("div"); hint.className="scroll-hint"; hint.textContent="← 左右滑動可查看整週 →";
  p.appendChild(hint);

  if(s.month){
    renderMonth(p, s);
  } else {
  const scroll=document.createElement("div"); scroll.className="table-scroll";
  const table=document.createElement("table");
  let hrow=`<th>班別 / 時段</th>`; WEEK.forEach((w,i)=>hrow+=`<th class="${i>=5?'weekend':''}">${w}</th>`);
  table.innerHTML=`<thead><tr>${hrow}</tr></thead>`;
  const tbody=document.createElement("tbody");
  (s.rows||[]).forEach(row=>{
    const tr=document.createElement("tr");
    if(!editMode){
      let c=`<td class="shift"><span class="sname">${esc(row.label)}</span><span class="stime">${esc(row.time||"")}</span></td>`;
      WEEK.forEach((w,i)=>c+=`<td class="${i>=5?'weekend':''}"><span class="person">${esc((row.cells&&row.cells[i])||"—")}</span></td>`);
      tr.innerHTML=c;
    } else {
      const td0=document.createElement("td"); td0.className="shift";
      td0.innerHTML=`<input class="f" style="margin-bottom:6px" value="${esc(row.label)}" placeholder="班別">
        <input class="f" value="${esc(row.time||"")}" placeholder="時段">`;
      const ins=td0.querySelectorAll("input"); ins[0].oninput=e=>row.label=e.target.value; ins[1].oninput=e=>row.time=e.target.value;
      tr.appendChild(td0);
      WEEK.forEach((w,i)=>{
        const td=document.createElement("td"); if(i>=5)td.className="weekend";
        const inp=document.createElement("input"); inp.className="f cell-in"; inp.value=(row.cells&&row.cells[i])||"";
        inp.oninput=e=>{ if(!row.cells)row.cells=Array(7).fill(""); row.cells[i]=e.target.value; };
        td.appendChild(inp); tr.appendChild(td);
      });
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); scroll.appendChild(table); p.appendChild(scroll);
  if(editMode){
    const tools=document.createElement("div"); tools.className="row-tools";
    const a=document.createElement("button"); a.className="mini-btn"; a.textContent="＋ 新增班別";
    a.onclick=()=>{ s.rows.push({label:"新班別",time:"",cells:Array(7).fill("")}); render(); };
    const d=document.createElement("button"); d.className="mini-btn danger"; d.textContent="－ 刪除最後一列";
    d.onclick=()=>{ if(s.rows.length){ s.rows.pop(); render(); } };
    tools.append(a,d); p.appendChild(tools);
  }
  }

  /* note sections */
  const nt=document.createElement("div"); nt.className="section-title"; nt.textContent="站務須知與工作常規";
  p.appendChild(nt);
  if(!editMode){
    (s.noteSections||[]).forEach((sec,i)=>{
      const box=document.createElement("div"); box.className="nsec"+(i===0?" open":"");
      const h=document.createElement("div"); h.className="nsec-head";
      h.innerHTML=`<span class="nicon" style="color:${noteColor(sec.title)}">${noteIcon(sec.title)}</span><span>${esc(sec.title)}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>`;
      h.onclick=()=>box.classList.toggle("open");
      const b=document.createElement("div"); b.className="nsec-body";
      const body=document.createElement("div"); body.className="note-body"; body.textContent=sec.body||"";
      b.appendChild(body); box.append(h,b); p.appendChild(box);
    });
    if(!(s.noteSections||[]).length) p.insertAdjacentHTML("beforeend",`<div class="note-body" style="color:var(--muted)">（無須知內容)</div>`);
  } else {
    (s.noteSections||[]).forEach((sec,i)=>{
      const w=document.createElement("div"); w.className="nsec-edit";
      const top=document.createElement("div"); top.style.cssText="display:flex;gap:8px;margin-bottom:8px";
      const ti=document.createElement("input"); ti.className="f"; ti.value=sec.title; ti.placeholder="區塊標題";
      ti.oninput=e=>sec.title=e.target.value;
      const rm=document.createElement("button"); rm.className="mini-btn danger"; rm.textContent="刪除區塊";
      rm.onclick=()=>{ s.noteSections.splice(i,1); render(); };
      top.append(ti,rm);
      const ta=document.createElement("textarea"); ta.className="f"; ta.value=sec.body||""; ta.placeholder="內容(可換行)";
      ta.oninput=e=>sec.body=e.target.value;
      w.append(top,ta); p.appendChild(w);
    });
    const add=document.createElement("button"); add.className="mini-btn"; add.textContent="＋ 新增須知區塊";
    add.onclick=()=>{ s.noteSections.push({title:"新區塊",body:""}); render(); };
    p.appendChild(add);
  }
  return p;
}

/* ---------- Regulations (single section view) ---------- */
function renderRules(){
  const idx=(current.id!=null?current.id:0);
  const sec=STATE.regulations[idx]; 
  const p=document.createElement("div"); p.className="panel";
  if(!sec){ p.innerHTML="<div>找不到此文件。</div>"; return p; }

  const head=document.createElement("div"); head.className="station-head";
  if(!editMode){
    head.innerHTML=`<h2>${esc(sec.title)} <span class="tag">管理文件</span></h2>`;
  } else {
    head.innerHTML=`<div class="fld"><label>文件標題</label><input class="f" id="r-title" value="${esc(sec.title)}"></div>
      <button class="mini-btn danger" id="r-del">刪除整份文件</button>`;
    head.querySelector("#r-title").oninput=e=>{ sec.title=e.target.value; renderSidebar(); };
    head.querySelector("#r-del").onclick=()=>{
      if(!confirm("確定刪除此文件?")) return;
      STATE.regulations.splice(idx,1);
      current={type: STATE.regulations.length?"rules":"station", id: STATE.regulations.length?0:(STATE.stations[0]&&STATE.stations[0].id)};
      render();
    };
  }
  p.appendChild(head);

  /* free-text body */
  if(!editMode){
    if(sec.body){ const b=document.createElement("div"); b.className="reg-body"; b.textContent=sec.body; p.appendChild(b); }
  } else {
    const fl=document.createElement("div"); fl.className="fld";
    fl.innerHTML=`<label>內文(自由文字,可換行)</label>`;
    const ta=document.createElement("textarea"); ta.className="f"; ta.style.minHeight="220px"; ta.value=sec.body||"";
    ta.oninput=e=>sec.body=e.target.value; fl.appendChild(ta); p.appendChild(fl);
  }

  /* numbered items (optional) */
  if((sec.items&&sec.items.length)||editMode){
    if(editMode){ const lab=document.createElement("div"); lab.className="section-title"; lab.style.fontSize=".95rem"; lab.textContent="條列項目(可選)"; p.appendChild(lab); }
    const ul=document.createElement("ul"); ul.className="reg-list";
    (sec.items||[]).forEach((it,ii)=>{
      const li=document.createElement("li");
      const num=document.createElement("span"); num.className="num"; num.textContent=ii+1; li.appendChild(num);
      if(!editMode){ const sp=document.createElement("span"); sp.style.flex="1"; sp.textContent=it; li.appendChild(sp); }
      else{
        const inp=document.createElement("input"); inp.className="f"; inp.value=it; inp.oninput=e=>sec.items[ii]=e.target.value; li.appendChild(inp);
        const rm=document.createElement("button"); rm.className="mini-btn danger"; rm.textContent="×"; rm.style.marginLeft="6px";
        rm.onclick=()=>{ sec.items.splice(ii,1); render(); }; li.appendChild(rm);
      }
      ul.appendChild(li);
    });
    p.appendChild(ul);
    if(editMode){ const a=document.createElement("button"); a.className="mini-btn"; a.style.marginTop="10px"; a.textContent="＋ 新增條目";
      a.onclick=()=>{ if(!sec.items)sec.items=[]; sec.items.push("新條目"); render(); }; p.appendChild(a); }
  }

  if(editMode){
    const a=document.createElement("button"); a.className="btn add-row"; a.style.display="flex"; a.style.marginTop="18px";
    a.textContent="＋ 在此後面新增一份管理文件";
    a.onclick=()=>{ STATE.regulations.push({title:"新文件",body:"",items:[]}); current={type:"rules",id:STATE.regulations.length-1}; render(); };
    p.appendChild(a);
  }
  return p;
}

/* ---------- Edit mode ---------- */
function toggleEdit(){
  editMode=!editMode;
  document.body.classList.toggle("editing",editMode);
  const btn=document.getElementById("edit-toggle"); btn.classList.toggle("warm",editMode);
  btn.innerHTML=editMode
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> 完成編輯`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> 編輯`;
  const co=document.getElementById("co-name");
  co.contentEditable=editMode; co.style.outline=editMode?"1px dashed var(--teal)":"none";
  co.style.borderRadius="6px"; co.style.padding=editMode?"0 4px":"0";
  if(editMode) co.oninput=()=>STATE.company.name=co.textContent.trim();
  render();
}

function addStation(){
  const id="st-"+Date.now().toString(36);
  STATE.stations.push({ id,name:"新救護站",tag:"日班",address:"",phone:"",supervisor:"",dept:"",caseNo:"",
    maps:[], rows:[{label:"日班",time:"08:00 – 16:00",cells:Array(7).fill("")}],
    noteSections:[{title:"注意事項",body:""},{title:"工作常規",body:""}] });
  current={type:"station",id};
  if(!editMode) toggleEdit(); else { render(); scrollTopMobile(); }
}
function removeStation(id){
  if(!confirm("確定要刪除此救護站?此動作無法復原。")) return;
  STATE.stations=STATE.stations.filter(s=>s.id!==id);
  if(current.id===id) current=STATE.stations.length?{type:"station",id:STATE.stations[0].id}:{type:"rules",id:0};
  render();
}

/* ---------- Download ---------- */
function downloadHTML(){
  const wasEdit=editMode; if(wasEdit) toggleEdit();
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector("#seed-data").textContent="\n"+JSON.stringify(STATE,null,2)+"\n";
  const co=clone.querySelector("#co-name"); if(co){ co.removeAttribute("contenteditable"); co.removeAttribute("style"); co.textContent=STATE.company.name; }
  const html="<!DOCTYPE html>\n"+clone.outerHTML;
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  const d=new Date(); const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  a.href=url; a.download=`怡安救護站_班表_${stamp}.html`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  if(wasEdit) toggleEdit();
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

document.addEventListener("DOMContentLoaded",()=>{
  loadState();
  document.getElementById("co-name").textContent=STATE.company.name||"怡安救護站";
  document.getElementById("co-sub").textContent=STATE.company.subtitle||"";
  setToday(); render();
});
</script>
